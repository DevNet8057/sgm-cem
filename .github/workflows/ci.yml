name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

# Le monorepo pnpm est dans le sous-dossier sgm-cem/
defaults:
  run:
    working-directory: sgm-cem

jobs:
  # ── Secrets : aucune clé ne doit entrer dans le dépôt ───────────────
  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (historique complet)
        working-directory: .
        env:
          GITLEAKS_VERSION: '8.28.0'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .

  # ── Type-check & audit ──────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sgm-cem/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: sgm-cem/pnpm-lock.yaml

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Vulnérabilités des dépendances de production
        run: pnpm audit --prod --audit-level high

      - name: Type-check API
        run: pnpm --filter api type-check

      - name: Type-check Web
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Tests Web
        run: pnpm --filter web test

  # ── API Tests ───────────────────────────────────────────────────────
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: sgm_cem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/sgm_cem_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-at-least-256-bits-long-padding
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-at-least-32-characters
      CSRF_SECRET: ci-test-csrf-secret
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sgm-cem/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: sgm-cem/pnpm-lock.yaml

      - name: Install dependencies
        # Chromium non téléchargé : les tests ne génèrent pas de PDF
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrations sur la base de test (comme en production)
        working-directory: sgm-cem/apps/api
        run: pnpm prisma migrate deploy && pnpm prisma generate

      - name: Schéma et migrations alignés (aucune modification sans migration)
        working-directory: sgm-cem/apps/api
        run: pnpm prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed (base jetable)
        working-directory: sgm-cem/apps/api
        env:
          SEED_DEMO: '1'
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: ci-admin-password-base-jetable
        run: pnpm exec ts-node prisma/seed.ts && pnpm exec ts-node prisma/seed-config.ts

      - name: Tests API + couverture (plancher dans vitest.config.ts)
        working-directory: sgm-cem/apps/api
        run: pnpm test:coverage

  # ── Web Build ───────────────────────────────────────────────────────
  build-web:
    name: Web build
    runs-on: ubuntu-latest
    needs: typecheck

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-google-client-id-for-build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sgm-cem/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: sgm-cem/pnpm-lock.yaml

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: sgm-cem/apps/web
        run: pnpm build

  # ── API Build ───────────────────────────────────────────────────────
  build-api:
    name: API build
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sgm-cem/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: sgm-cem/pnpm-lock.yaml

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: sgm-cem/apps/api
        run: pnpm build
