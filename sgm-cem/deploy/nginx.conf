map $http_upgrade $sgm_connection_upgrade {
    default upgrade;
    '' close;
}

upstream sgm_cem_api {
    server 127.0.0.1:3001;
}

upstream sgm_cem_web {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name sgm-cem.16-16-63-155.sslip.io 16.16.63.155;
    server_tokens off;

    # Les certificats IP et domaine conservent le meme webroot de renouvellement.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://sgm-cem.16-16-63-155.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 16.16.63.155;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/sgm-cem-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgm-cem-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://sgm-cem.16-16-63-155.sslip.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sgm-cem.16-16-63-155.sslip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sgm-cem-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgm-cem-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SGMCEMSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sgm_connection_upgrade;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Aucun acces direct au volume : les documents restent controles par l'API.
    location ~ ^/(api|socket\.io|webhooks|uploads)(/|$) {
        proxy_pass http://sgm_cem_api;
    }

    location / {
        proxy_pass http://sgm_cem_web;
    }
}
