# Compose de PRODUCTION — voir docs/exploitation/03_GUIDE_DEPLOIEMENT_PRODUCTION.md
# Usage (sur le serveur, dans /opt/sgm-cem) :
#   docker compose -f docker-compose.prod.yml config   # validation
#   docker compose -f docker-compose.prod.yml up -d
# Images applicatives : IMAGE_API / IMAGE_WEB épinglées par empreinte (sortie CI).
# Images tierces épinglées le 17/10/2026 : mettre à jour volontairement, jamais « latest ».
name: sgm-cem

x-app-defaults: &app
  restart: unless-stopped
  env_file: .env
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=256m"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { APP_DOMAIN: "${APP_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [edge]
    depends_on: { web: { condition: service_healthy }, api: { condition: service_healthy } }

  web:
    <<: *app
    image: ${IMAGE_WEB}
    environment: { NODE_ENV: production, PORT: "3000", HOSTNAME: "0.0.0.0" }
    tmpfs: ["/tmp:size=256m", "/app/apps/web/.next/cache:size=256m,uid=1000"]   # cache d'images Next (écriture requise)
    networks: [edge]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    <<: *app
    image: ${IMAGE_API}
    # L'entrypoint sauvegarde la base, applique les migrations puis lance dist/index.js
    environment: { NODE_ENV: production, TRUST_PROXY: "1" }
    tmpfs: ["/tmp:size=256m", "/home/node:size=64m,uid=1000"]
    volumes:
      - uploads:/app/apps/api/uploads          # fichiers locaux si aucun stockage S3 n'est configuré
      - dbbackups:/app/apps/api/backups        # sauvegardes prises avant chaque démarrage
    networks: [edge, internal]
    mem_limit: 1536m
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # worker (BullMQ, crons, PDF) : lot 3 — tant qu'il n'existe pas, l'API exécute ces tâches.

  migrate:                                        # one-shot, lancé explicitement (§ 9.6, § 10)
    <<: *app
    image: ${IMAGE_API}
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    read_only: false                             # le CLI Prisma écrit des fichiers temporaires
    networks: [internal]
    restart: "no"
    profiles: ["ops"]
    depends_on: { postgres: { condition: service_healthy } }

  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    shm_size: 256m
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }   # requis par le healthcheck
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # gotenberg (rendu PDF isolé, ADR-007) : lot 3 — Chromium est pour l'instant dans l'image API.

networks:
  edge: {}
  internal: { internal: true }          # aucun accès Internet : voir la note ci-dessous

volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {}, uploads: {}, dbbackups: {} }
