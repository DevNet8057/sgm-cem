# Compose de PRODUCTION — voir docs/exploitation/03_GUIDE_DEPLOIEMENT_PRODUCTION.md
# Usage (sur le serveur, dans /opt/sgm-cem) :
#   docker compose -f docker-compose.prod.yml config   # validation
#   docker compose -f docker-compose.prod.yml up -d
# Images applicatives : IMAGE_API / IMAGE_WEB épinglées par empreinte (sortie CI).
# Images tierces épinglées le 17/10/2026 : mettre à jour volontairement, jamais « latest ».
name: sgm-cem-prod                 # distinct du projet de développement (volumes séparés)

x-app-defaults: &app
  restart: unless-stopped
  env_file: .env
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=256m"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { APP_DOMAIN: "${APP_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [edge]
    depends_on: { web: { condition: service_healthy }, api: { condition: service_healthy } }

  web:
    <<: *app
    image: ${IMAGE_WEB}
    environment: { NODE_ENV: production, TZ: Africa/Douala, PORT: "3000", HOSTNAME: "0.0.0.0" }
    tmpfs: ["/tmp:size=256m", "/app/apps/web/.next/cache:size=256m,uid=1000"]   # cache d'images Next (écriture requise)
    networks: [edge]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    <<: *app
    image: ${IMAGE_API}
    user: "1000:1000"                            # jamais root (dossiers de l'image et volumes neufs : uid 1000)
    # L'entrypoint sauvegarde la base, applique les migrations puis lance dist/index.js
    # Tâches planifiées exécutées par le service worker (BullMQ, une exécution par échéance)
    environment: { NODE_ENV: production, TZ: Africa/Douala, TRUST_PROXY: "1", RUN_SCHEDULED_JOBS: "false", GOTENBERG_URL: "http://gotenberg:3000" }
    tmpfs: ["/tmp:size=256m", "/home/node:size=64m,uid=1000"]
    volumes:
      - uploads:/app/apps/api/uploads          # fichiers locaux si aucun stockage S3 n'est configuré
      - dbbackups:/app/apps/api/backups        # sauvegardes prises avant chaque démarrage
    networks: [edge, internal]
    mem_limit: 1536m
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, gotenberg: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Tâches planifiées hors du processus HTTP (lot 3.1) : réconciliation des paiements,
  # contrôle du grand livre, relevés mensuels, purge d'activité. Même image que l'API ;
  # démarre après elle (migrations appliquées par l'entrypoint de l'API).
  worker:
    <<: *app
    image: ${IMAGE_API}
    user: "1000:1000"
    working_dir: /app/apps/api
    command: ["node", "dist/worker.js"]
    # Pas de serveur HTTP : le contrôle de santé de l'image API (port 3001) ne s'applique pas.
    # Bon fonctionnement visible dans « Santé du système » (tâches planifiées à jour ou en retard).
    healthcheck: { disable: true }
    environment: { NODE_ENV: production, TZ: Africa/Douala, GOTENBERG_URL: "http://gotenberg:3000" }
    tmpfs: ["/tmp:size=256m", "/home/node:size=64m,uid=1000"]
    volumes:
      - uploads:/app/apps/api/uploads          # relevés et reçus générés par les tâches
    networks: [edge, internal]                 # edge : Yelii, CinetPay, WhatsApp, SMS, e-mail
    mem_limit: 1024m
    depends_on: { api: { condition: service_healthy }, redis: { condition: service_healthy } }

  migrate:                                        # one-shot, lancé explicitement (§ 9.6, § 10)
    <<: *app
    image: ${IMAGE_API}
    user: "1000:1000"
    working_dir: /app/apps/api
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    read_only: false                             # le CLI Prisma écrit des fichiers temporaires
    networks: [internal]
    restart: "no"
    profiles: ["ops"]
    depends_on: { postgres: { condition: service_healthy } }

  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    shm_size: 256m
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }   # requis par le healthcheck
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Rendu PDF isolé (lot 3.2, ADR-007) : JavaScript désactivé, réseau interne SANS
  # accès Internet ; l'API et le worker l'appellent via GOTENBERG_URL (sans lui,
  # repli sur le Chromium de l'image API). Version 8.38.1 épinglée le 17/10/2026.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    restart: unless-stopped
    # Chromium lancé au démarrage (et non à la 1re conversion) avec 60 s de marge : sans cela, le
    # premier PDF après un déploiement échouait sur un serveur chargé (délai de 20 s dépassé).
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-auto-start=true", "--chromium-start-timeout=60s", "--api-timeout=60s", "--log-level=warn"]
    networks: [internal]
    tmpfs: ["/tmp:size=512m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge: {}
  internal: { internal: true }          # aucun accès Internet : voir la note ci-dessous

volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {}, uploads: {}, dbbackups: {} }
